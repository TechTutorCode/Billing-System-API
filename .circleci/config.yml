version: 2.1

executors:
  docker-executor:
    docker:
      - image: circleci/python:3.9
    working_directory: ~/repo

jobs:
  build:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t billing-system-api .

  deploy:
    executor: docker-executor
    steps:
      - run:
          name: Install sshpass
          command: |
            sudo apt-get update
            sudo apt-get install -y sshpass
      - run:
          name: Deploy to Server
          command: |
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no administrator@37.60.242.201 \<< 'EOF'
            cd Billing-System-API
            
            # Create .env dynamically on the server
            cat > .env << 'EOL'
DATABASE_URL=$DATABASE_URL
BREVO_API_KEY=$BREVO_API_KEY
BREVO_SENDER_EMAIL=$BREVO_SENDER_EMAIL
BREVO_SENDER_NAME=$BREVO_SENDER_NAME
FRONTEND_VERIFY_URL=$FRONTEND_VERIFY_URL
JWT_SECRET_KEY=$JWT_SECRET_KEY
JWT_REFRESH_SECRET_KEY=$JWT_REFRESH_SECRET_KEY
JWT_ALGORITHM=$JWT_ALGORITHM
JWT_ACCESS_TOKEN_EXPIRE_MINUTES=$JWT_ACCESS_TOKEN_EXPIRE_MINUTES
JWT_REFRESH_TOKEN_EXPIRE_DAYS=$JWT_REFRESH_TOKEN_EXPIRE_DAYS
CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
DEBUG=$DEBUG
EOL
            
            # Pull latest code
            git pull origin main
            
            # Rebuild and restart containers
            docker-compose down
            docker-compose up --build -d
EOF

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main