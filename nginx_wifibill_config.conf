# HTTPS server
server {
    listen 443 ssl http2;
    server_name wifibill.techtutor.co.ke www.wifibill.techtutor.co.ke;

    ssl_certificate /etc/letsencrypt/live/wifibill.techtutor.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wifibill.techtutor.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Prevent absolute redirects that might change protocol
    absolute_redirect off;
    
    location / {
        # Proxy to FastAPI - preserve everything, let FastAPI handle CORS
        proxy_pass http://127.0.0.1:8071;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        
        # CRITICAL: Prevent nginx from modifying redirects
        proxy_redirect off;
        
        # Don't buffer responses (helps with redirects)
        proxy_buffering off;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name wifibill.techtutor.co.ke www.wifibill.techtutor.co.ke;

    # Add CORS headers to redirect response
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-CSRF-Token' always;

    location / {
        return 301 https://$host$request_uri;
    }
}
